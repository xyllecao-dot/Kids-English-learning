// Screen 1: Login
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <h1>📖 Kids English World 🌟</h1>
    <p>Welcome! Please enter your name to start learning:</p>
    <input type="text" id="nameInput" placeholder="Enter your name..." />
    <br>
    <button class="btn" onclick="startApp()">Start Reading 🚀</button>
  `;
}

function startApp() {
  const input = document.getElementById('nameInput').value.trim();
  if (!input) {
    alert("Please enter your name!");
    return;
  }
  userName = input;
  currentStoryIndex = 0;
  currentQuestionIndex = 0;
  userScore = 0;
  renderStory(currentStoryIndex);
}

// Screen 2: Read Story
function renderStory(index) {
  const story = stories[index];
  document.getElementById('app').innerHTML = `
    <div class="user-bar">
      <span>👤 Reader: ${userName}</span>
      <span>📚 Book ${index + 1} / 10</span>
    </div>
    <h1>${story.title}</h1>
    <div class="book-cover">
      <div class="story-emoji">${story.emoji}</div>
      <div class="story-text">
        ${story.paragraph}
      </div>
    </div>
    <button class="btn" onclick="speakStory()">🔊 Listen / Read</button>
    <button class="btn" style="background: linear-gradient(45deg, #2ed573, #1e90ff);" onclick="finishReading()">Start Task! ➡️</button>
  `;
}

function speakStory() {
  const text = stories[currentStoryIndex].paragraph;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }
}

function finishReading() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  currentQuestionIndex = 0;
  renderTask(currentStoryIndex, currentQuestionIndex);
}

// Screen 3: Quiz Tasks (10 Questions per Story)
function renderTask(storyIdx, qIdx) {
  const story = stories[storyIdx];
  const qData = story.questions[qIdx];
  let optionsHTML = "";
  
  qData.opts.forEach((opt, idx) => {
    optionsHTML += `<button class="quiz-option" onclick="checkAnswer(${idx})">${opt}</button>`;
  });

  document.getElementById('app').innerHTML = `
    <div class="user-bar">
      <span>👤 ${userName}</span>
      <span>📚 Book ${storyIdx + 1}/10</span>
      <span>🎯 Q ${qIdx + 1}/10</span>
    </div>
    <h1>Task Time! 🧠</h1>
    <p style="font-size: 1.35rem; font-weight: bold; color: #3742fa;">${qData.q}</p>
    <div>${optionsHTML}</div>
    <div class="feedback-msg" id="feedback"></div>
    <button class="btn" id="nextBtn" style="display:none; background: linear-gradient(45deg, #2ed573, #10ac84);" onclick="nextQuestion()">Next Question ➡️</button>
  `;
}

function checkAnswer(selectedIndex) {
  const story = stories[currentStoryIndex];
  const qData = story.questions[currentQuestionIndex];
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  
  if (selectedIndex === qData.ans) {
    feedback.className = "feedback-msg correct";
    feedback.innerHTML = "🎉 Correct! Great job!";
    userScore++;
    nextBtn.style.display = "inline-block";
  } else {
    feedback.className = "feedback-msg wrong";
    feedback.innerHTML = "❌ Try again!";
  }
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < 10) {
    renderTask(currentStoryIndex, currentQuestionIndex);
  } else {
    currentStoryIndex++;
    if (currentStoryIndex < stories.length) {
      renderStory(currentStoryIndex);
    } else {
      renderCertificate();
    }
  }
}

// Screen 4: Completion Certificate
function renderCertificate() {
  document.getElementById('app').innerHTML = `
    <div style="font-size: 5rem;" class="story-emoji">🏆</div>
    <h1>CONGRATULATIONS!</h1>
    <h2>Awesome Job, ${userName}!</h2>
    <p>You successfully read all 10 animal stories and finished all 100 tasks!</p>
    <p style="font-size: 1.6rem; color: #2ed573; font-weight: bold;">
      Final Score: ${userScore} / 100 Questions Completed!
    </p>
    <button class="btn" onclick="renderLogin()">Read Again 🔄</button>
  `;
}

renderLogin();
